<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maka-Villa Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f1ea;
            color: #222;
        }

        #loginSection {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.15);
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #8b5e00;
        }

        .login-box p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            border: none;
            padding: 11px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .login-btn {
            width: 100%;
            background: #8b5e00;
            color: white;
            padding: 14px;
        }

        .login-btn:hover {
            background: #704b00;
        }

        #loginMessage {
            margin-top: 15px;
            text-align: center;
            color: #c0392b;
        }

        #dashboardSection {
            display: none;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
        }

        .header-content {
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        header h1 {
            color: #d4af37;
        }

        .logout-btn {
            background: #c0392b;
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            text-align: center;
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 30px;
            font-weight: bold;
            color: #8b5e00;
        }

        .section-title {
            margin-bottom: 15px;
            font-size: 24px;
        }

        #bookingsContainer {
            display: grid;
            gap: 18px;
        }

        .booking-card {
            background: white;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .booking-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px;
        }

        .booking-top h3 {
            color: #333;
            font-size: 20px;
        }

        .status {
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status.Pending {
            background: #fff3cd;
            color: #856404;
        }

        .status.Confirmed {
            background: #d4edda;
            color: #155724;
        }

        .status.Cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .booking-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 18px;
        }

        .detail {
            background: #f8f8f8;
            padding: 12px;
            border-radius: 8px;
        }

        .detail strong {
            display: block;
            font-size: 12px;
            color: #777;
            margin-bottom: 5px;
        }

        .detail span {
            font-size: 15px;
            word-break: break-word;
        }

        .detail a {
            color: #8b5e00;
            text-decoration: none;
        }

        .detail a:hover {
            text-decoration: underline;
        }

        .message-box {
            background: #faf7ef;
            padding: 14px;
            border-left: 4px solid #d4af37;
            border-radius: 6px;
            margin-bottom: 18px;
        }

        .message-box strong {
            display: block;
            margin-bottom: 6px;
        }

        .booking-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .pending-btn {
            background: #f0ad4e;
            color: white;
        }

        .confirm-btn {
            background: #28a745;
            color: white;
        }

        .cancel-btn {
            background: #dc3545;
            color: white;
        }

        .whatsapp-btn {
            background: #25d366;
            color: white;
        }

        .refresh-btn {
            background: #333;
            color: white;
            margin-bottom: 20px;
        }

        button:hover {
            opacity: 0.88;
        }

        .empty {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            color: #777;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        @media (max-width: 800px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .booking-details {
                grid-template-columns: 1fr;
            }

            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width: 500px) {
            .container {
                padding: 0 12px;
            }

            .booking-card {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

<!-- LOGIN -->

<section id="loginSection">

    <div class="login-box">

        <h1>🏨 Maka-Villa</h1>

        <p>Administrator Login</p>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div id="loginMessage"></div>

    </div>

</section>


<!-- DASHBOARD -->

<section id="dashboardSection">

    <header>

        <div class="header-content">

            <div>
                <h1>🏨 Maka-Villa Admin</h1>
                <p>Bookings Management Dashboard</p>
            </div>

            <button class="logout-btn" onclick="logout()">
                Logout
            </button>

        </div>

    </header>


    <div class="container">

        <div class="stats">

            <div class="stat-card">
                <h3>Total Bookings</h3>
                <div class="number" id="totalCount">0</div>
            </div>

            <div class="stat-card">
                <h3>Pending</h3>
                <div class="number" id="pendingCount">0</div>
            </div>

            <div class="stat-card">
                <h3>Confirmed</h3>
                <div class="number" id="confirmedCount">0</div>
            </div>

            <div class="stat-card">
                <h3>Cancelled</h3>
                <div class="number" id="cancelledCount">0</div>
            </div>

        </div>


        <button class="refresh-btn" onclick="loadBookings()">
            🔄 Refresh Bookings
        </button>


        <h2 class="section-title">
            Customer Reservations
        </h2>


        <div id="bookingsContainer">

            <div class="loading">
                Loading bookings...
            </div>

        </div>

    </div>

</section>


<script>

const API_URL =
    "https://makavilla-backend-2026.onrender.com";


let adminUsername = "";
let adminPassword = "";


/* LOGIN */

document
.getElementById("loginForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const loginMessage =
        document.getElementById("loginMessage");

    loginMessage.textContent = "Logging in...";


    try {

        const response = await fetch(
            `${API_URL}/api/admin/login`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    username: username,
                    password: password
                })
            }
        );


        const data = await response.json();


        if (!response.ok) {

            loginMessage.textContent =
                data.message || "Login failed.";

            return;
        }


        adminUsername = username;
        adminPassword = password;


        document.getElementById("loginSection")
            .style.display = "none";

        document.getElementById("dashboardSection")
            .style.display = "block";


        loadBookings();


    } catch (error) {

        console.error(error);

        loginMessage.textContent =
            "Could not connect to the server.";

    }

});


/* AUTH HEADERS */

function getHeaders() {

    return {

        "Content-Type": "application/json",

        "x-admin-username": adminUsername,

        "x-admin-password": adminPassword

    };

}


/* LOAD BOOKINGS */

async function loadBookings() {

    const container =
        document.getElementById("bookingsContainer");

    container.innerHTML =
        '<div class="loading">Loading bookings...</div>';


    try {

        const response = await fetch(
            `${API_URL}/api/admin/bookings`,
            {
                method: "GET",
                headers: getHeaders()
            }
        );


        if (!response.ok) {

            if (response.status === 401) {

                alert(
                    "Your login session is no longer valid."
                );

                logout();

                return;
            }

            throw new Error(
                `Server returned ${response.status}`
            );

        }


        const result =
            await response.json();


        /*
            IMPORTANT FIX:

            The backend may return:

            {
                bookings: [...]
            }

            instead of directly returning:

            [...]
        */

        let bookings = [];


        if (Array.isArray(result)) {

            bookings = result;

        } else if (Array.isArray(result.bookings)) {

            bookings = result.bookings;

        } else if (Array.isArray(result.data)) {

            bookings = result.data;

        } else {

            console.error(
                "Unexpected bookings response:",
                result
            );

            throw new Error(
                "The server returned an unexpected bookings format."
            );

        }


        updateStats(bookings);


        if (bookings.length === 0) {

            container.innerHTML = `
                <div class="empty">

                    <h3>No bookings yet</h3>

                    <p>
                        Customer reservations will appear here.
                    </p>

                </div>
            `;

            return;
        }


        container.innerHTML = "";


        bookings
            .slice()
            .reverse()
            .forEach(booking => {

                container.innerHTML +=
                    createBookingCard(booking);

            });


    } catch (error) {

        console.error(error);

        container.innerHTML = `

            <div class="empty">

                <h3>Unable to load bookings</h3>

                <p>
                    ${escapeHtml(error.message)}
                </p>

            </div>

        `;

    }

}


/* STATISTICS */

function updateStats(bookings) {

    const total =
        bookings.length;


    const pending =
        bookings.filter(
            booking =>
                booking.status === "Pending"
        ).length;


    const confirmed =
        bookings.filter(
            booking =>
                booking.status === "Confirmed"
        ).length;


    const cancelled =
        bookings.filter(
            booking =>
                booking.status === "Cancelled"
        ).length;


    document.getElementById("totalCount")
        .textContent = total;

    document.getElementById("pendingCount")
        .textContent = pending;

    document.getElementById("confirmedCount")
        .textContent = confirmed;

    document.getElementById("cancelledCount")
        .textContent = cancelled;

}


/* BOOKING CARD */

function createBookingCard(booking) {

    const email =
        booking.email || "Not provided";

    const phone =
        booking.phone || "Not provided";

    const message =
        booking.message || "No additional message";

    const status =
        booking.status || "Pending";


    return `

        <div class="booking-card">

            <div class="booking-top">

                <h3>
                    👤 ${escapeHtml(
                        booking.name || "Unknown Customer"
                    )}
                </h3>

                <span class="status ${escapeHtml(status)}">
                    ${escapeHtml(status)}
                </span>

            </div>


            <div class="booking-details">


                <div class="detail">

                    <strong>📞 PHONE</strong>

                    <span>

                        ${
                            phone !== "Not provided"

                            ? `
                                <a href="tel:${escapeHtml(phone)}">
                                    ${escapeHtml(phone)}
                                </a>
                              `

                            : "Not provided"
                        }

                    </span>

                </div>


                <div class="detail">

                    <strong>📧 CUSTOMER EMAIL</strong>

                    <span>

                        ${
                            email !== "Not provided"

                            ? `
                                <a href="mailto:${escapeHtml(email)}">
                                    ${escapeHtml(email)}
                                </a>
                              `

                            : "Not provided"
                        }

                    </span>

                </div>


                <div class="detail">

                    <strong>🏨 RESERVATION TYPE</strong>

                    <span>
                        ${escapeHtml(
                            booking.type || "Not provided"
                        )}
                    </span>

                </div>


                <div class="detail">

                    <strong>👥 NUMBER OF GUESTS</strong>

                    <span>
                        ${escapeHtml(
                            String(
                                booking.guests ||
                                "Not provided"
                            )
                        )}
                    </span>

                </div>


                <div class="detail">

                    <strong>📅 DATE</strong>

                    <span>
                        ${escapeHtml(
                            booking.date || "Not provided"
                        )}
                    </span>

                </div>


                <div class="detail">

                    <strong>⏰ PREFERRED TIME</strong>

                    <span>
                        ${escapeHtml(
                            booking.time || "Not provided"
                        )}
                    </span>

                </div>


            </div>


            <div class="message-box">

                <strong>💬 Additional Message</strong>

                <span>
                    ${escapeHtml(message)}
                </span>

            </div>


            <div class="booking-actions">


                <button
                    class="pending-btn"
                    onclick="changeStatus(
                        '${booking.id}',
                        'Pending'
                    )"
                >
                    ⏳ Pending
                </button>


                <button
                    class="confirm-btn"
                    onclick="changeStatus(
                        '${booking.id}',
                        'Confirmed'
                    )"
                >
                    ✅ Confirm
                </button>


                <button
                    class="cancel-btn"
                    onclick="changeStatus(
                        '${booking.id}',
                        'Cancelled'
                    )"
                >
                    ❌ Cancel
                </button>


                <button
                    class="whatsapp-btn"
                    onclick='notifyWhatsApp(
                        ${JSON.stringify(booking)}
                    )'
                >
                    💬 Notify on WhatsApp
                </button>


            </div>

        </div>

    `;

}


/* CHANGE STATUS */

async function changeStatus(id, status) {

    try {

        const response = await fetch(
            `${API_URL}/api/admin/bookings/${id}`,
            {
                method: "PATCH",

                headers: getHeaders(),

                body: JSON.stringify({
                    status: status
                })
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "Unable to update booking."
            );

            return;
        }


        alert(
            `Booking status changed to ${status}.`
        );


        /*
            When Confirmed or Cancelled,
            the backend sends the customer email.
        */

        loadBookings();


    } catch (error) {

        console.error(error);

        alert(
            "Could not connect to the backend."
        );

    }

}


/* WHATSAPP */

function notifyWhatsApp(booking) {

    if (!booking.phone) {

        alert(
            "This customer does not have a phone number."
        );

        return;
    }


    let phone =
        String(booking.phone)
        .replace(/\D/g, "");


    if (phone.startsWith("0")) {

        phone =
            "254" + phone.substring(1);

    }


    const status =
        booking.status || "Pending";


    let message;


    if (status === "Confirmed") {

        message =
`Hello ${booking.name},

Your reservation at Maka-Villa Bar & Restaurant has been CONFIRMED.

Reservation Type: ${booking.type || "N/A"}
Guests: ${booking.guests || "N/A"}
Date: ${booking.date || "N/A"}
Time: ${booking.time || "N/A"}

For any questions, contact Maka-Villa on 0742020633.

Thank you for choosing Maka-Villa.`;

    }

    else if (status === "Cancelled") {

        message =
`Hello ${booking.name},

We regret to inform you that your reservation at Maka-Villa Bar & Restaurant has been CANCELLED.

Reservation Type: ${booking.type || "N/A"}
Guests: ${booking.guests || "N/A"}
Date: ${booking.date || "N/A"}
Time: ${booking.time || "N/A"}

For assistance, contact Maka-Villa on 0742020633.

Thank you.`;

    }

    else {

        message =
`Hello ${booking.name},

We have received your reservation request at Maka-Villa Bar & Restaurant.

Reservation Type: ${booking.type || "N/A"}
Guests: ${booking.guests || "N/A"}
Date: ${booking.date || "N/A"}
Time: ${booking.time || "N/A"}

Your reservation is currently PENDING confirmation.

Maka-Villa: 0742020633

Thank you.`;

    }


    const whatsappURL =
        `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;


    window.open(
        whatsappURL,
        "_blank"
    );

}


/* LOGOUT */

function logout() {

    adminUsername = "";
    adminPassword = "";


    document.getElementById("dashboardSection")
        .style.display = "none";


    document.getElementById("loginSection")
        .style.display = "flex";


    document.getElementById("username")
        .value = "";


    document.getElementById("password")
        .value = "";


    document.getElementById("loginMessage")
        .textContent = "";

}


/* HTML SECURITY */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
