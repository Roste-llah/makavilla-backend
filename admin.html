<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Maka-Villa Admin Dashboard</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #101010;
    color: #fff;
}

:root {
    --gold: #d4a017;
    --gold-light: #f0c75e;
    --dark: #151515;
    --dark2: #1d1d1d;
    --border: #333;
    --green: #25d366;
    --red: #e74c3c;
    --blue: #3498db;
}

button {
    font-family: inherit;
}

/* LOGIN */

.login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;

    background:
        linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.9)),
        url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1800&q=80")
        center/cover;
}

.login-box {
    width: 100%;
    max-width: 430px;
    background: rgba(20,20,20,.97);
    border: 1px solid #444;
    border-radius: 14px;
    padding: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

.logo {
    text-align: center;
    margin-bottom: 30px;
}

.logo h1 {
    color: var(--gold-light);
    font-size: 28px;
}

.logo p {
    color: #888;
    font-size: 13px;
    margin-top: 5px;
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    color: #ddd;
    font-size: 14px;
    margin-bottom: 7px;
}

input,
select {
    width: 100%;
    padding: 13px;
    border-radius: 6px;
    border: 1px solid #444;
    background: #101010;
    color: #fff;
    outline: none;
}

input:focus,
select:focus {
    border-color: var(--gold);
}

.login-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 6px;
    background: var(--gold);
    color: #111;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

.login-btn:hover {
    background: var(--gold-light);
}

.login-error {
    display: none;
    margin-top: 15px;
    padding: 12px;
    border-radius: 6px;
    background: rgba(231,76,60,.12);
    border: 1px solid var(--red);
    color: #ffaaa0;
}

/* DASHBOARD */

.dashboard {
    display: none;
    min-height: 100vh;
}

.header {
    background: #151515;
    border-bottom: 1px solid #333;
    padding: 18px 25px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-inner {
    max-width: 1400px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.header-logo h1 {
    color: var(--gold-light);
    font-size: 23px;
}

.header-logo p {
    color: #777;
    font-size: 12px;
}

.header-actions {
    display: flex;
    gap: 10px;
}

.top-btn {
    border: 1px solid #444;
    background: #222;
    color: white;
    padding: 9px 15px;
    border-radius: 6px;
    cursor: pointer;
}

.top-btn:hover {
    border-color: var(--gold);
}

.logout-btn {
    border-color: var(--red);
    color: #ff9d94;
}

/* MAIN */

.main {
    max-width: 1400px;
    margin: auto;
    padding: 30px 20px 60px;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(6,1fr);
    gap: 15px;
    margin-bottom: 30px;
}

.stat {
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
}

.stat-label {
    color: #888;
    font-size: 13px;
    margin-bottom: 7px;
}

.stat-number {
    font-size: 30px;
    font-weight: bold;
}

.stat.total .stat-number {
    color: var(--gold-light);
}

.stat.restaurant .stat-number {
    color: #ffcf66;
}

.stat.accommodation .stat-number {
    color: #a98cff;
}

.stat.pending .stat-number {
    color: #f1c40f;
}

.stat.confirmed .stat-number {
    color: var(--green);
}

.stat.cancelled .stat-number {
    color: var(--red);
}

/* TOOLBAR */

.toolbar {
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 25px;

    display: grid;
    grid-template-columns: 2fr 1fr 1fr auto;
    gap: 12px;
}

.toolbar input,
.toolbar select {
    min-height: 44px;
}

.refresh-btn {
    padding: 0 20px;
    border: none;
    border-radius: 6px;
    background: var(--gold);
    color: #111;
    font-weight: bold;
    cursor: pointer;
}

.refresh-btn:hover {
    background: var(--gold-light);
}

/* STATUS */

.system-status {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #888;
    font-size: 13px;
    margin-bottom: 20px;
}

.status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--green);
}

/* BOOKINGS */

.bookings-container {
    display: grid;
    gap: 18px;
}

.booking-card {
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
}

.booking-header {
    padding: 18px 20px;
    border-bottom: 1px solid #303030;

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.customer-name {
    font-size: 20px;
    font-weight: bold;
}

.reference {
    color: var(--gold-light);
    font-size: 13px;
    margin-top: 3px;
}

.status {
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.status.pending {
    background: rgba(241,196,15,.12);
    color: #f1c40f;
}

.status.confirmed {
    background: rgba(37,211,102,.12);
    color: #6ff09a;
}

.status.cancelled {
    background: rgba(231,76,60,.12);
    color: #ff9187;
}

.booking-body {
    padding: 20px;
}

.booking-grid {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 18px;
}

.info {
    min-width: 0;
}

.info-label {
    color: #777;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 5px;
}

.info-value {
    color: #eee;
    word-break: break-word;
}

.info-value a {
    color: var(--gold-light);
}

.booking-message {
    margin-top: 20px;
    background: #111;
    border: 1px solid #2e2e2e;
    border-radius: 7px;
    padding: 15px;
}

.booking-message strong {
    color: var(--gold-light);
}

.booking-actions {
    padding: 15px 20px;
    border-top: 1px solid #303030;

    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.action-btn {
    border: none;
    padding: 10px 15px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

.confirm-btn {
    background: var(--green);
    color: #07150c;
}

.cancel-btn {
    background: var(--red);
    color: white;
}

.pending-btn {
    background: #555;
    color: white;
}

.whatsapp-btn {
    background: #25d366;
    color: #061108;
}

.action-btn:hover {
    opacity: .85;
}

.action-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

/* EMPTY */

.empty {
    background: var(--dark);
    border: 1px dashed #444;
    border-radius: 10px;
    text-align: center;
    padding: 60px 20px;
    color: #777;
}

.empty-icon {
    font-size: 40px;
    margin-bottom: 10px;
}

/* LOADING */

.loading {
    text-align: center;
    padding: 50px;
    color: #888;
}

/* TOAST */

.toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    max-width: 400px;
    padding: 15px 20px;
    background: #222;
    border: 1px solid #444;
    border-radius: 8px;
    display: none;
    z-index: 1000;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
}

.toast.success {
    border-color: var(--green);
}

.toast.error {
    border-color: var(--red);
}

/* MOBILE */

@media(max-width:1100px) {

    .stats {
        grid-template-columns: repeat(3,1fr);
    }

    .booking-grid {
        grid-template-columns: repeat(2,1fr);
    }

    .toolbar {
        grid-template-columns: 1fr 1fr;
    }
}

@media(max-width:700px) {

    .header-inner {
        align-items: flex-start;
        flex-direction: column;
    }

    .header-actions {
        width: 100%;
    }

    .top-btn {
        flex: 1;
    }

    .stats {
        grid-template-columns: 1fr 1fr;
    }

    .toolbar {
        grid-template-columns: 1fr;
    }

    .booking-header {
        align-items: flex-start;
        flex-direction: column;
    }

    .booking-grid {
        grid-template-columns: 1fr;
    }

    .booking-actions {
        flex-direction: column;
    }

    .action-btn {
        width: 100%;
    }

    .login-box {
        padding: 25px;
    }
}

</style>
</head>

<body>


<!-- LOGIN SCREEN -->

<div class="login-screen" id="loginScreen">

<div class="login-box">

<div class="logo">

<h1>MAKA-VILLA</h1>

<p>ADMIN RESERVATION DASHBOARD</p>

</div>


<form id="loginForm">

<div class="form-group">

<label for="username">
Username
</label>

<input
type="text"
id="username"
required
autocomplete="username"
placeholder="Enter admin username"
>

</div>


<div class="form-group">

<label for="password">
Password
</label>

<input
type="password"
id="password"
required
autocomplete="current-password"
placeholder="Enter admin password"
>

</div>


<button
type="submit"
class="login-btn"
id="loginButton"
>
Login
</button>


<div
class="login-error"
id="loginError"
></div>

</form>

</div>

</div>



<!-- DASHBOARD -->

<div class="dashboard" id="dashboard">


<header class="header">

<div class="header-inner">

<div class="header-logo">

<h1>Maka-Villa Admin</h1>

<p>Restaurant & Accommodation Reservations</p>

</div>


<div class="header-actions">

<button
class="top-btn"
onclick="loadBookings()"
>
🔄 Refresh
</button>

<button
class="top-btn logout-btn"
onclick="logout()"
>
Logout
</button>

</div>

</div>

</header>



<main class="main">


<!-- STATS -->

<div class="stats">

<div class="stat total">

<div class="stat-label">
Total Bookings
</div>

<div
class="stat-number"
id="totalCount"
>
0
</div>

</div>


<div class="stat restaurant">

<div class="stat-label">
Restaurant
</div>

<div
class="stat-number"
id="restaurantCount"
>
0
</div>

</div>


<div class="stat accommodation">

<div class="stat-label">
Accommodation
</div>

<div
class="stat-number"
id="accommodationCount"
>
0
</div>

</div>


<div class="stat pending">

<div class="stat-label">
Pending
</div>

<div
class="stat-number"
id="pendingCount"
>
0
</div>

</div>


<div class="stat confirmed">

<div class="stat-label">
Confirmed
</div>

<div
class="stat-number"
id="confirmedCount"
>
0
</div>

</div>


<div class="stat cancelled">

<div class="stat-label">
Cancelled
</div>

<div
class="stat-number"
id="cancelledCount"
>
0
</div>

</div>

</div>



<!-- TOOLBAR -->

<div class="toolbar">

<input
type="text"
id="searchInput"
placeholder="🔎 Search name, phone, email or reference..."
oninput="renderBookings()"
>


<select
id="typeFilter"
onchange="renderBookings()"
>

<option value="all">
All Booking Types
</option>

<option value="restaurant">
Restaurant
</option>

<option value="accommodation">
Accommodation
</option>

</select>


<select
id="statusFilter"
onchange="renderBookings()"
>

<option value="all">
All Statuses
</option>

<option value="Pending">
Pending
</option>

<option value="Confirmed">
Confirmed
</option>

<option value="Cancelled">
Cancelled
</option>

</select>


<button
class="refresh-btn"
onclick="loadBookings()"
>
Refresh Bookings
</button>

</div>



<div class="system-status">

<span class="status-dot"></span>

<span>
Connected to Maka-Villa booking server
</span>

</div>



<!-- BOOKINGS -->

<div
class="bookings-container"
id="bookingsContainer"
>

<div class="loading">
Loading bookings...
</div>

</div>


</main>

</div>


<div
class="toast"
id="toast"
></div>



<script>

const BACKEND_URL =
"https://makavilla-backend-2026.onrender.com";


let bookings = [];

let adminUsername = "";

let adminPassword = "";



/* LOGIN */

document
.getElementById("loginForm")
.addEventListener(
"submit",
async function(event) {

event.preventDefault();


const username =
document
.getElementById("username")
.value
.trim();


const password =
document
.getElementById("password")
.value;


const loginButton =
document
.getElementById("loginButton");


const loginError =
document
.getElementById("loginError");


loginError.style.display =
"none";


loginButton.disabled = true;

loginButton.textContent =
"Logging in...";


try {

const response =
await fetch(
BACKEND_URL +
"/api/admin/login",
{

method: "POST",

headers: {
"Content-Type":
"application/json"
},

body:
JSON.stringify({
username,
password
})

}
);


let result = {};

try {

result =
await response.json();

} catch {

result = {};

}


if (!response.ok) {

throw new Error(
result.message ||
"Invalid username or password."
);

}


adminUsername = username;

adminPassword = password;


document
.getElementById("loginScreen")
.style.display = "none";


document
.getElementById("dashboard")
.style.display = "block";


showToast(
"Login successful.",
"success"
);


await loadBookings();


} catch (error) {

console.error(error);


loginError.textContent =
error.message ||
"Login failed.";


loginError.style.display =
"block";


} finally {

loginButton.disabled = false;

loginButton.textContent =
"Login";

}

});



/* LOAD BOOKINGS */

async function loadBookings() {

const container =
document
.getElementById(
"bookingsContainer"
);


container.innerHTML =
'<div class="loading">Loading bookings...</div>';


try {

const response =
await fetch(
BACKEND_URL +
"/api/admin/bookings",
{

method: "GET",

headers: {

"x-admin-username":
adminUsername,

"x-admin-password":
adminPassword

}

}
);


if (!response.ok) {

if (
response.status === 401 ||
response.status === 403
) {

logout();

throw new Error(
"Your admin session is no longer valid."
);

}

throw new Error(
"Unable to load bookings."
);

}


const result =
await response.json();


/*
    The backend may return:
    []
    OR
    { bookings: [] }
    OR
    { data: [] }
*/

if (Array.isArray(result)) {

bookings = result;

} else if (
Array.isArray(result.bookings)
) {

bookings = result.bookings;

} else if (
Array.isArray(result.data)
) {

bookings = result.data;

} else {

throw new Error(
"The server returned an unexpected bookings format."
);

}


bookings =
bookings.map(function(booking) {

return {

...booking,

status:
booking.status ||
"Pending"

};

});


updateStats();

renderBookings();


showToast(
"Bookings updated.",
"success"
);


} catch (error) {

console.error(
"Load bookings error:",
error
);


container.innerHTML = `

<div class="empty">

<div class="empty-icon">⚠️</div>

<h3>Unable to load bookings</h3>

<p style="margin-top:8px;">
${escapeHtml(error.message)}
</p>

<button
class="refresh-btn"
style="margin-top:20px;padding:12px 20px;"
onclick="loadBookings()"
>
Try Again
</button>

</div>

`;

}

}



/* UPDATE STATS */

function updateStats() {

const total =
bookings.length;


const restaurant =
bookings.filter(function(booking) {

return getBookingCategory(
booking
) === "restaurant";

}).length;


const accommodation =
bookings.filter(function(booking) {

return getBookingCategory(
booking
) === "accommodation";

}).length;


const pending =
bookings.filter(function(booking) {

return normalizeStatus(
booking.status
) === "Pending";

}).length;


const confirmed =
bookings.filter(function(booking) {

return normalizeStatus(
booking.status
) === "Confirmed";

}).length;


const cancelled =
bookings.filter(function(booking) {

return normalizeStatus(
booking.status
) === "Cancelled";

}).length;


document.getElementById(
"totalCount"
).textContent = total;


document.getElementById(
"restaurantCount"
).textContent = restaurant;


document.getElementById(
"accommodationCount"
).textContent = accommodation;


document.getElementById(
"pendingCount"
).textContent = pending;


document.getElementById(
"confirmedCount"
).textContent = confirmed;


document.getElementById(
"cancelledCount"
).textContent = cancelled;

}



/* CATEGORY */

function getBookingCategory(
booking
) {

const type =
String(
booking.type || ""
).toLowerCase();


if (
type.includes("accommodation")
) {

return "accommodation";

}


return "restaurant";

}



/* STATUS */

function normalizeStatus(status) {

const value =
String(
status || "Pending"
).toLowerCase();


if (
value === "confirmed"
) {

return "Confirmed";

}


if (
value === "cancelled"
) {

return "Cancelled";

}


return "Pending";

}



/* RENDER */

function renderBookings() {

const container =
document
.getElementById(
"bookingsContainer"
);


const search =
document
.getElementById(
"searchInput"
)
.value
.toLowerCase()
.trim();


const typeFilter =
document
.getElementById(
"typeFilter"
)
.value;


const statusFilter =
document
.getElementById(
"statusFilter"
)
.value;


let filtered =
bookings.filter(function(booking) {


const searchable = [

booking.name,

booking.phone,

booking.email,

booking.reference,

booking.bookingReference,

booking.id,

booking.type,

booking.date,

booking.message

]
.join(" ")
.toLowerCase();


const matchesSearch =
!search ||
searchable.includes(search);


const category =
getBookingCategory(
booking
);


const matchesType =
typeFilter === "all" ||
category === typeFilter;


const status =
normalizeStatus(
booking.status
);


const matchesStatus =
statusFilter === "all" ||
status === statusFilter;


return (
matchesSearch &&
matchesType &&
matchesStatus
);

});


/* SORT NEWEST FIRST */

filtered.sort(function(a,b) {

const aTime =
Number(a.createdAt || a.id || 0);

const bTime =
Number(b.createdAt || b.id || 0);

return bTime - aTime;

});


if (
filtered.length === 0
) {

container.innerHTML = `

<div class="empty">

<div class="empty-icon">📭</div>

<h3>No bookings found</h3>

<p style="margin-top:8px;">
There are no reservations matching your current filters.
</p>

</div>

`;

return;

}


container.innerHTML =
filtered
.map(createBookingCard)
.join("");

}



/* BOOKING CARD */

function createBookingCard(
booking
) {

const status =
normalizeStatus(
booking.status
);


const category =
getBookingCategory(
booking
);


const reference =
booking.reference ||
booking.bookingReference ||
booking.id ||
"Not available";


const name =
booking.name ||
"Unknown Customer";


const phone =
booking.phone ||
"Not provided";


const email =
booking.email ||
"Not provided";


const guests =
booking.guests ||
"Not specified";


const date =
booking.date ||
"Not specified";


const time =
booking.time ||
"Not specified";


const type =
booking.type ||
category;


const message =
booking.message ||
"No additional message.";


let extraDetails = "";


/*
   Accommodation details are stored
   inside the booking message.
*/

if (
category === "accommodation"
) {

extraDetails = `

<div class="info">

<div class="info-label">
Booking
</div>

<div class="info-value">
🏨 Accommodation
</div>

</div>

`;

} else {

extraDetails = `

<div class="info">

<div class="info-label">
Booking
</div>

<div class="info-value">
🍽️ Restaurant
</div>

</div>

`;

}


return `

<div class="booking-card">

<div class="booking-header">

<div>

<div class="customer-name">
${escapeHtml(name)}
</div>

<div class="reference">
Reference: ${escapeHtml(String(reference))}
</div>

</div>


<div class="status ${status.toLowerCase()}">
${status}
</div>

</div>


<div class="booking-body">

<div class="booking-grid">


${extraDetails}


<div class="info">

<div class="info-label">
Phone
</div>

<div class="info-value">

<a href="tel:${escapeHtml(phone)}">
${escapeHtml(phone)}
</a>

</div>

</div>


<div class="info">

<div class="info-label">
Email
</div>

<div class="info-value">

<a href="mailto:${escapeHtml(email)}">
${escapeHtml(email)}
</a>

</div>

</div>


<div class="info">

<div class="info-label">
Guests
</div>

<div class="info-value">
${escapeHtml(String(guests))}
</div>

</div>


<div class="info">

<div class="info-label">
Date
</div>

<div class="info-value">
${escapeHtml(formatDate(date))}
</div>

</div>


<div class="info">

<div class="info-label">
Time
</div>

<div class="info-value">
${escapeHtml(formatTime(time))}
</div>

</div>


<div class="info">

<div class="info-label">
Type
</div>

<div class="info-value">
${escapeHtml(type)}
</div>

</div>


</div>


<div class="booking-message">

<strong>
Customer Request
</strong>

<div style="margin-top:8px;color:#bbb;">
${escapeHtml(message)}
</div>

</div>

</div>


<div class="booking-actions">

<button
class="action-btn confirm-btn"
onclick="changeStatus('${escapeJs(String(booking.id || reference))}','Confirmed')"
${status === "Confirmed" ? "disabled" : ""}
>
✅ Confirm
</button>


<button
class="action-btn cancel-btn"
onclick="changeStatus('${escapeJs(String(booking.id || reference))}','Cancelled')"
${status === "Cancelled" ? "disabled" : ""}
>
❌ Cancel
</button>


<button
class="action-btn pending-btn"
onclick="changeStatus('${escapeJs(String(booking.id || reference))}','Pending')"
${status === "Pending" ? "disabled" : ""}
>
⏳ Pending
</button>


<button
class="action-btn whatsapp-btn"
onclick='notifyWhatsApp(${JSON.stringify({
phone: phone,
name: name,
reference: reference,
status: status,
type: type,
date: date,
time: time
})})'
>
💬 WhatsApp
</button>

</div>

</div>

`;

}



/* CHANGE STATUS */

async function changeStatus(
id,
newStatus
) {

if (!id) {

showToast(
"Booking ID is missing.",
"error"
);

return;

}


const booking =
bookings.find(function(item) {

return String(
item.id
) === String(id);

});


if (!booking) {

showToast(
"Booking could not be found.",
"error"
);

return;

}


const customerName =
booking.name ||
"customer";


const confirmed =
confirm(
"Change " +
customerName +
"'s booking to " +
newStatus +
"?"
);


if (!confirmed) {

return;

}


try {

const response =
await fetch(
BACKEND_URL +
"/api/admin/bookings/" +
encodeURIComponent(id),
{

method: "PATCH",

headers: {

"Content-Type":
"application/json",

"x-admin-username":
adminUsername,

"x-admin-password":
adminPassword

},

body:
JSON.stringify({
status: newStatus
})

}
);


const result =
await response.json();


if (!response.ok) {

throw new Error(
result.message ||
"Unable to update booking."
);

}


/*
   Update local booking immediately
   so dashboard changes instantly.
*/

booking.status =
newStatus;


updateStats();

renderBookings();


showToast(
"Booking updated to " +
newStatus +
".",
"success"
);


} catch (error) {

console.error(
"Status update error:",
error
);


showToast(
error.message ||
"Unable to update booking.",
"error"
);

}

}



/* WHATSAPP */

function notifyWhatsApp(
booking
) {

let phone =
String(
booking.phone || ""
)
.replace(
/[^0-9]/g,
""
);


/*
   Convert Kenyan numbers:
   0742020633 -> 254742020633
   254742020633 -> unchanged
*/

if (
phone.startsWith("0")
) {

phone =
"254" +
phone.substring(1);

}


if (
phone.startsWith("+")
) {

phone =
phone.substring(1);

}


if (
phone.length < 10
) {

showToast(
"Customer phone number is not valid.",
"error"
);

return;

}


let message = "";


if (
booking.status === "Confirmed"
) {

message =
"Hello " +
booking.name +
", this is Maka-Villa. Your reservation " +
booking.reference +
" has been CONFIRMED. We look forward to welcoming you. Thank you.";

} else if (
booking.status === "Cancelled"
) {

message =
"Hello " +
booking.name +
", this is Maka-Villa. Unfortunately, your reservation " +
booking.reference +
" has been CANCELLED. Please contact us if you need assistance. Thank you.";

} else {

message =
"Hello " +
booking.name +
", this is Maka-Villa. Your reservation " +
booking.reference +
" is currently PENDING. We will update you once it has been reviewed. Thank you.";

}


const whatsappUrl =
"https://wa.me/" +
phone +
"?text=" +
encodeURIComponent(message);


window.open(
whatsappUrl,
"_blank"
);

}



/* LOGOUT */

function logout() {

adminUsername = "";

adminPassword = "";

bookings = [];


document
.getElementById(
"dashboard"
)
.style.display = "none";


document
.getElementById(
"loginScreen"
)
.style.display = "flex";


document
.getElementById(
"password"
)
.value = "";


document
.getElementById(
"username"
)
.value = "";

}



/* TOAST */

function showToast(
message,
type
) {

const toast =
document.getElementById(
"toast"
);


toast.textContent =
message;


toast.className =
"toast " +
(type || "");


toast.style.display =
"block";


setTimeout(function() {

toast.style.display =
"none";

}, 3500);

}



/* DATE */

function formatDate(
date
) {

if (!date) {

return "Not specified";

}


const parsed =
new Date(date);


if (
isNaN(parsed.getTime())
) {

return String(date);

}


return parsed.toLocaleDateString(
"en-KE",
{
year: "numeric",
month: "long",
day: "numeric"
}
);

}



/* TIME */

function formatTime(
time
) {

if (
!time ||
time === "Accommodation"
) {

return time ||
"Not specified";

}


const parts =
String(time).split(":");


if (
parts.length < 2
) {

return time;

}


let hour =
parseInt(parts[0],10);


const minute =
parts[1];


const suffix =
hour >= 12
? "PM"
: "AM";


hour =
hour % 12 || 12;


return (
hour +
":" +
minute +
" " +
suffix
);

}



/* SECURITY HELPERS */

function escapeHtml(
value
) {

return String(value ?? "")
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}


function escapeJs(
value
) {

return String(value ?? "")
.replace(
/\\/g,
"\\\\"
)
.replace(
/'/g,
"\\'"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/\n/g,
"\\n"
)
.replace(
/\r/g,
"\\r"
);

}
