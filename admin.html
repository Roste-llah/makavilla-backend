<body>

<div class="container">

    <div id="loginSection" class="login-box">

        <h1>🔐 Maka-Villa Admin</h1>
        <p class="subtitle">Administrator Login</p>

        <div id="loginMessage" class="message"></div>

        <label>Username</label>
        <input type="text" id="username" placeholder="Enter username">

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password">

        <button class="login-btn" onclick="login()">Login</button>

    </div>


    <div id="dashboardSection" class="dashboard" style="display:none;">

        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">

            <div>
                <h1>🏨 Maka-Villa Admin Dashboard</h1>
                <p class="subtitle">Manage customer reservations</p>
            </div>

            <div>
                <button class="refresh" onclick="loadBookings()">🔄 Refresh</button>
                <button class="logout" onclick="logout()">Logout</button>
            </div>

        </div>


        <div id="dashboardMessage" class="message"></div>


        <div class="stats">

            <div class="stat">
                <h2 id="totalCount">0</h2>
                <p>Total</p>
            </div>

            <div class="stat">
                <h2 id="pendingCount">0</h2>
                <p>Pending</p>
            </div>

            <div class="stat">
                <h2 id="confirmedCount">0</h2>
                <p>Confirmed</p>
            </div>

            <div class="stat">
                <h2 id="cancelledCount">0</h2>
                <p>Cancelled</p>
            </div>

        </div>


        <div id="bookingsList">
            <div class="empty">Loading bookings...</div>
        </div>

    </div>

</div>


<script>

const API_URL = "https://makavilla-backend-2026.onrender.com";

let adminUsername = "";
let adminPassword = "";


/* =========================
   LOGIN
========================= */

async function login() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    if (!username || !password) {

        showMessage(
            "loginMessage",
            "Please enter your username and password.",
            "error"
        );

        return;
    }

    try {

        const response = await fetch(
            `${API_URL}/api/admin/login`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.message || "Login failed."
            );
        }

        adminUsername = username;
        adminPassword = password;

        document.getElementById("loginSection").style.display = "none";

        document.getElementById("dashboardSection").style.display = "block";

        loadBookings();

    } catch (error) {

        showMessage(
            "loginMessage",
            error.message,
            "error"
        );
    }
}


/* =========================
   LOAD BOOKINGS
========================= */

async function loadBookings() {

    const bookingsList =
        document.getElementById("bookingsList");

    bookingsList.innerHTML =
        '<div class="empty">Loading bookings...</div>';

    try {

        const response = await fetch(
            `${API_URL}/api/admin/bookings`,
            {
                method: "GET",
                headers: {
                    "x-admin-username": adminUsername,
                    "x-admin-password": adminPassword
                }
            }
        );

        const data = await response.json();

        if (!response.ok) {

            throw new Error(
                data.message || "Failed to load bookings."
            );
        }

        const bookings =
            Array.isArray(data)
                ? data
                : (data.bookings || []);

        /* FIXED: update statistics */

        updateStats(bookings);


        if (bookings.length === 0) {

            bookingsList.innerHTML =
                '<div class="empty">No bookings yet.</div>';

            return;
        }


        bookingsList.innerHTML = "";


        bookings
            .slice()
            .reverse()
            .forEach(function(booking) {

                bookingsList.innerHTML +=
                    createBookingCard(booking);

            });


    } catch (error) {

        bookingsList.innerHTML =
            `<div class="message error" style="display:block;">
                ${escapeHtml(error.message)}
            </div>`;
    }
}


/* =========================
   UPDATE STATISTICS
========================= */

function updateStats(bookings) {

    let total = bookings.length;

    let pending = 0;
    let confirmed = 0;
    let cancelled = 0;


    bookings.forEach(function(booking) {

        const status =
            booking.status || "Pending";


        if (status === "Pending") {
            pending++;
        }

        else if (status === "Confirmed") {
            confirmed++;
        }

        else if (status === "Cancelled") {
            cancelled++;
        }

    });


    document.getElementById("totalCount").textContent =
        total;

    document.getElementById("pendingCount").textContent =
        pending;

    document.getElementById("confirmedCount").textContent =
        confirmed;

    document.getElementById("cancelledCount").textContent =
        cancelled;
}


/* =========================
   CREATE BOOKING CARD
========================= */

function createBookingCard(booking) {

    const status =
        booking.status || "Pending";


    const customerName =
        booking.name ||
        booking.fullName ||
        "Customer";


    const phone =
        booking.phone ||
        "Not provided";


    const reservation =
        booking.reservationType ||
        booking.type ||
        "Not specified";


    const guests =
        booking.guests ||
        booking.numberOfGuests ||
        "Not specified";


    const date =
        booking.date ||
        "Not specified";


    const time =
        booking.time ||
        booking.preferredTime ||
        "Not specified";


    const message =
        booking.message ||
        booking.additionalMessage ||
        "None";


    return `

        <div class="booking">

            <h3>
                ${escapeHtml(customerName)}
            </h3>

            <p>
                <strong>📞 Phone:</strong>
                ${escapeHtml(phone)}
            </p>

            <p>
                <strong>🍽️ Reservation:</strong>
                ${escapeHtml(reservation)}
            </p>

            <p>
                <strong>👥 Guests:</strong>
                ${escapeHtml(String(guests))}
            </p>

            <p>
                <strong>📅 Date:</strong>
                ${escapeHtml(date)}
            </p>

            <p>
                <strong>⏰ Time:</strong>
                ${escapeHtml(time)}
            </p>

            <p>
                <strong>💬 Message:</strong>
                ${escapeHtml(message)}
            </p>

            <div>

                <span class="status status-${status}">
                    ${escapeHtml(status)}
                </span>

            </div>


            <div class="actions">

                <button
                    class="confirm"
                    onclick="updateStatus('${booking.id}', 'Confirmed')">
                    ✅ Confirm
                </button>


                <button
                    class="cancel"
                    onclick="updateStatus('${booking.id}', 'Cancelled')">
                    ❌ Cancel
                </button>


                <button
                    class="pending"
                    onclick="updateStatus('${booking.id}', 'Pending')">
                    ⏳ Pending
                </button>


                ${
                    booking.phone
                    ?
                    `
                    <button
                        class="whatsapp"
                        onclick='notifyWhatsApp(${JSON.stringify(booking)})'>
                        📱 Notify on WhatsApp
                    </button>
                    `
                    :
                    ""
                }

            </div>

        </div>

    `;
}


/* =========================
   UPDATE BOOKING STATUS
========================= */

async function updateStatus(id, status) {

    try {

        const response = await fetch(
            `${API_URL}/api/admin/bookings/${id}`,
            {
                method: "PATCH",

                headers: {
                    "Content-Type": "application/json",
                    "x-admin-username": adminUsername,
                    "x-admin-password": adminPassword
                },

                body: JSON.stringify({
                    status: status
                })
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to update booking."
            );
        }


        showMessage(
            "dashboardMessage",
            `Booking successfully changed to ${status}.`,
            "success"
        );


        loadBookings();


    } catch (error) {

        showMessage(
            "dashboardMessage",
            error.message,
            "error"
        );
    }
}


/* =========================
   WHATSAPP NOTIFICATION
========================= */

function notifyWhatsApp(booking) {

    let phone =
        booking.phone || "";


    phone =
        phone.replace(/\D/g, "");


    /* Convert Kenyan number */

    if (phone.startsWith("0")) {

        phone =
            "254" +
            phone.substring(1);
    }


    if (!phone.startsWith("254")) {

        alert(
            "Please check the customer's phone number. " +
            "Use a valid Kenyan number."
        );

        return;
    }


    const customerName =
        booking.name ||
        booking.fullName ||
        "Customer";


    const date =
        booking.date ||
        "your selected date";


    const time =
        booking.time ||
        booking.preferredTime ||
        "your selected time";


    const reservation =
        booking.reservationType ||
        booking.type ||
        "reservation";


    let message = "";


    if (booking.status === "Confirmed") {

        message =
`Hello ${customerName},

This is Maka-Villa Bar & Restaurant.

Your ${reservation} reservation for ${date} at ${time} has been CONFIRMED. ✅

We look forward to welcoming you to Maka-Villa.

Thank you for choosing Maka-Villa.`;

    }

    else if (booking.status === "Cancelled") {

        message =
`Hello ${customerName},

This is Maka-Villa Bar & Restaurant.

Unfortunately, your ${reservation} reservation for ${date} at ${time} has been CANCELLED. ❌

Please contact us on 0742020633 if you need further assistance.

Thank you.`;

    }

    else {

        message =
`Hello ${customerName},

This is Maka-Villa Bar & Restaurant.

Your reservation for ${date} at ${time} is currently PENDING. ⏳

We will contact you once your reservation has been confirmed.

Thank you for choosing Maka-Villa.`;
    }


    const whatsappURL =
        `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;


    window.open(
        whatsappURL,
        "_blank"
    );
}


/* =========================
   LOGOUT
========================= */

function logout() {

    adminUsername = "";
    adminPassword = "";


    document.getElementById("dashboardSection")
        .style.display = "none";


    document.getElementById("loginSection")
        .style.display = "block";


    document.getElementById("username")
        .value = "";


    document.getElementById("password")
        .value = "";
}


/* =========================
   SHOW MESSAGE
========================= */

function showMessage(
    elementId,
    message,
    type
) {

    const element =
        document.getElementById(elementId);


    element.textContent =
        message;


    element.className =
        `message ${type}`;


    element.style.display =
        "block";


    setTimeout(function() {

        element.style.display =
            "none";

    }, 4000);
}


/* =========================
   HTML SECURITY
========================= */

function escapeHtml(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
